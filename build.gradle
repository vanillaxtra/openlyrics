buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

group = 'dev.openlyrics'
version = mod_version

subprojects {
    def mc = name
    def yarn = rootProject.property("yarn_${mc}")
    def fapi = rootProject.property("fapi_${mc}")
    def loader = rootProject.property('loader_version')
    def modVer = rootProject.property('mod_version')

    apply plugin: 'fabric-loom'

    group = 'dev.openlyrics'
    version = "${modVer}+${mc}"

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${mc}"
        mappings "net.fabricmc:yarn:${yarn}:v2"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fapi}"
        modImplementation "net.fabricmc:fabric-loader:${loader}"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(rootProject.property('java_version').toString()))
        }
    }

    sourceSets.main {
        java {
            srcDirs = [rootProject.file('dev')]
        }
        resources {
            srcDirs = [rootProject.projectDir]
            include 'assets/**'
            include 'fabric.mod.json'
            include 'openlyrics.*'
            include 'META-INF/**'
        }
    }

    processResources {
        inputs.property 'version', project.version
        inputs.property 'minecraft', mc
        // ttf must stay binary — filteringCharset on this task rewrites 0x80+ as U+FFFD
        filesMatching('fabric.mod.json') {
            filteringCharset = 'UTF-8'
            expand version: project.version, minecraft_version: mc
        }
        doFirst {
            def bad = []
            fileTree(rootProject.file('assets/openlyrics/font')) { include '*.ttf' }.each { f ->
                byte[] b = f.bytes
                boolean magic = b.length >= 16 && b[0] == 0 && b[1] == 1 && b[2] == 0 && b[3] == 0
                boolean tofu = b.length >= 11 && (b[8] & 0xff) == 0xEF && (b[9] & 0xff) == 0xBF && (b[10] & 0xff) == 0xBD
                if (!magic || tofu) bad << f.name
            }
            if (!bad.isEmpty()) throw new GradleException('corrupt ttf (utf-8 replacement): ' + bad)
        }
    }

    tasks.named('jar', org.gradle.jvm.tasks.Jar) {
        archiveBaseName.set('openlyrics')
        archiveVersion.set("${modVer}-${mc}")
    }

    remapJar {
        archiveBaseName.set('openlyrics')
        archiveVersion.set("${modVer}-${mc}")
    }
}

def remapJars = subprojects.collect { it.tasks.named('remapJar') }

tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Copy each Minecraft version jar into build/libs'
    dependsOn remapJars
    from subprojects.collect { it.layout.buildDirectory.dir('libs') }
    into layout.buildDirectory.dir('libs')
    include 'openlyrics-*-*.jar'
    exclude '*-dev.jar', '*-sources.jar'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    doFirst {
        delete fileTree(layout.buildDirectory.dir('libs')).matching { include 'openlyrics-*.jar' }
    }
}

tasks.register('build') {
    group = 'build'
    description = 'Build one openlyrics jar per Minecraft version'
    dependsOn collectJars
}

tasks.register('compileJava') {
    group = 'build'
    dependsOn subprojects.collect { it.tasks.named('compileJava') }
}

tasks.register('clean', Delete) {
    group = 'build'
    delete layout.buildDirectory
    dependsOn subprojects.collect { it.tasks.named('clean') }
}
