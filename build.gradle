plugins {
    id 'net.fabricmc.fabric-loom' apply false
    id 'net.fabricmc.fabric-loom-remap' apply false
}

group = 'dev.openlyrics'
version = mod_version

subprojects {
    def mc = name
    def unobf = mc.startsWith('26.')
    def artifact = rootProject.hasProperty("mc_artifact_${mc}") ? rootProject.property("mc_artifact_${mc}").toString() : mc
    def fapi = rootProject.property("fapi_${mc}")
    def modVer = rootProject.property('mod_version')
    def javaN = Integer.parseInt((unobf ? rootProject.property('java26_version') : rootProject.property('java_version')).toString())
    def loader = unobf ? rootProject.property('loader26_version') : rootProject.property('loader_version')
    def aw = unobf ? 'openlyrics-mojang.accesswidener' : 'openlyrics.accesswidener'
    def srcDir = unobf ? rootProject.file('dev26') : rootProject.file('dev')

    if (unobf) {
        apply plugin: 'net.fabricmc.fabric-loom'
    } else {
        apply plugin: 'net.fabricmc.fabric-loom-remap'
    }

    group = 'dev.openlyrics'
    version = "${modVer}+${mc}"

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${artifact}"
        if (unobf) {
            implementation "net.fabricmc.fabric-api:fabric-api:${fapi}"
            implementation "net.fabricmc:fabric-loader:${loader}"
        } else {
            mappings "net.fabricmc:yarn:${rootProject.property("yarn_${mc}")}:v2"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${fapi}"
            modImplementation "net.fabricmc:fabric-loader:${loader}"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaN)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = javaN
    }

    sourceSets.main {
        java {
            srcDirs = [srcDir]
            if (unobf) {
                srcDirs += rootProject.file("compat/${mc}")
            }
        }
        resources {
            srcDirs = [rootProject.projectDir]
            include 'assets/**'
            include 'fabric.mod.json'
            include 'openlyrics.*'
            include 'openlyrics-mojang.accesswidener'
            include 'META-INF/**'
        }
    }

    processResources {
        inputs.property 'version', project.version
        inputs.property 'minecraft', artifact
        filesMatching('fabric.mod.json') {
            filteringCharset = 'UTF-8'
            expand version: project.version,
                    minecraft_version: artifact,
                    java_dep: javaN,
                    access_widener: aw
        }
        doFirst {
            def bad = []
            fileTree(rootProject.file('assets/openlyrics/font')) { include '*.ttf' }.each { f ->
                byte[] b = f.bytes
                boolean magic = b.length >= 16 && b[0] == 0 && b[1] == 1 && b[2] == 0 && b[3] == 0
                boolean tofu = b.length >= 11 && (b[8] & 0xff) == 0xEF && (b[9] & 0xff) == 0xBF && (b[10] & 0xff) == 0xBD
                if (!magic || tofu) bad << f.name
            }
            if (!bad.isEmpty()) throw new GradleException('corrupt ttf (utf-8 replacement): ' + bad)
        }
    }

    tasks.named('jar', org.gradle.jvm.tasks.Jar) {
        archiveBaseName.set('openlyrics')
        archiveVersion.set("${modVer}-${mc}")
    }

    if (!unobf) {
        remapJar {
            archiveBaseName.set('openlyrics')
            archiveVersion.set("${modVer}-${mc}")
        }
    }
}

def packedJars = subprojects.collect { p ->
    p.tasks.findByName('remapJar') ?: p.tasks.named('jar')
}

tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Copy each Minecraft version jar into build/libs'
    dependsOn packedJars
    from subprojects.collect { it.layout.buildDirectory.dir('libs') }
    into layout.buildDirectory.dir('libs')
    include 'openlyrics-*-*.jar'
    exclude '*-dev.jar', '*-sources.jar'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    doFirst {
        delete fileTree(layout.buildDirectory.dir('libs')).matching { include 'openlyrics-*.jar' }
    }
}

tasks.register('build') {
    group = 'build'
    description = 'Build one openlyrics jar per Minecraft version'
    dependsOn collectJars
}

tasks.register('compileJava') {
    group = 'build'
    dependsOn subprojects.collect { it.tasks.named('compileJava') }
}

tasks.register('clean', Delete) {
    group = 'build'
    delete layout.buildDirectory
    dependsOn subprojects.collect { it.tasks.named('clean') }
}
